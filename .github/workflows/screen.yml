name: ENDGAME diagnostic screening only
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: endgame-daily-publication
  cancel-in-progress: false
jobs:
  screen:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
      ENDGAME_MONTHLY_BUDGET_EUR: ${{ vars.ENDGAME_MONTHLY_BUDGET_EUR }}
      OPENAI_REVIEW_MODEL: ${{ vars.OPENAI_REVIEW_MODEL }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/screen-queue.mjs
      - name: Preserve review evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screening-evidence
          path: agent/out/screening.json
          if-no-files-found: warn
