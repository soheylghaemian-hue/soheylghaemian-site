name: ENDGAME daily bilingual publication
on:
  schedule:
    - cron: '0 9 * * *'
      timezone: 'Europe/Berlin'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: endgame-daily-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ github.token }}
      ENDGAME_MONTHLY_BUDGET_EUR: ${{ vars.ENDGAME_MONTHLY_BUDGET_EUR }}
      PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      OPENAI_REVIEW_MODEL: ${{ vars.OPENAI_REVIEW_MODEL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Verify prerequisites and prepare one EN/DE contribution
        run: npm run editor:prepare
      - name: Stage only the new contribution
        run: npm run editor:stage
      - name: Validate build
        run: npm run check:vercel
      - name: Commit with fresh domain and daily-limit checks
        run: node scripts/commit-publication.mjs
      - name: Verify both real article URLs and image
        run: npm run editor:verify
      - name: Record outcome
        if: always()
        run: node scripts/publication-summary.mjs
      - name: Preserve review and publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-evidence
          path: |
            agent/out/generated-draft.json
            agent/out/screening.json
            agent/out/receipt.json
          if-no-files-found: warn
